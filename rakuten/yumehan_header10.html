    .product-slide-item img {

    }

                </div>

            </button>
            <button id="next-btn" class="absolute top-1/2 -right-3 transform -translate-y-1/2 bg-white p-2 rounded-full shadow-md hover:bg-gray-200 transition duration-300 z-20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>

        <!-- カテゴリリンク -->
        <a id="category-link-btn" href="https://item.rakuten.co.jp/u-b-yumehan/c/" class="w-full text-center rounded-xl flex items-center justify-center space-x-3 shadow-lg border transition-all duration-300 group" target="_blank" rel="noopener noreferrer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
            </svg>
            <span class="font-semibold text-lg">店内カテゴリ一覧</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var TRANSITION_DURATION = 400;
    var CALENDAR_TRANSITION = 600;
    
    // ★検索フォーム：店舗ID203612対応（正しい楽天検索URL）
    var searchForm = document.getElementById('search-form');
    var searchInput = document.getElementById('search-input');
    var searchButton = document.getElementById('search-button');
    
    function performSearch(query) {
        if (query.trim()) {
            // ★店舗ID203612の正しい楽天検索URL
            var encodedQuery = encodeURIComponent(query.trim());
            var searchUrl = 'https://search.rakuten.co.jp/search/mall/' + encodedQuery + '/?l-id=shoptop_shopmenu_search_bar&sid=203612';
            window.open(searchUrl, '_blank', 'noopener,noreferrer');
        } else {
            // 空欄時は店舗検索トップ
            window.open('https://search.rakuten.co.jp/search/mall/%E3%82%B7%E3%83%A7%E3%83%83%E3%83%97%E6%A4%9C%E7%B4%A2/?sid=203612', '_blank', 'noopener,noreferrer');
        }
    }
    
    // Enterキー
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
            e.preventDefault();
            performSearch(searchInput.value);
        }
    });
    
    // ルーペボタンクリック
    searchButton.addEventListener('click', function(e) {
        e.preventDefault();
        performSearch(searchInput.value);
    });
    
    // フォーム送信
    searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        performSearch(searchInput.value);
    });
    
    // カレンダー：動的拡大版（最小42px、最大78px=1.5倍）
    var calViewport = document.getElementById('calendar-viewport');
    var calView = document.getElementById('calendar-view');
    var prevDayBtnCal = document.getElementById('prev-day-btn-cal');
    var nextDayBtnCal = document.getElementById('next-day-btn-cal');
    var currentDate = new Date();
    var DAYS_TO_SHOW = 14;
    
    // 2025年11月~2026年12月 休日設定
    var HOLIDAYS = [
        '2025-11-03','2025-11-23','2025-11-24','2025-12-29','2025-12-30','2025-12-31',
        '2026-01-01','2026-01-02','2026-01-12','2026-02-11','2026-02-23','2026-03-20',
        '2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20',
        '2026-08-10','2026-08-11','2026-08-12','2026-08-13','2026-08-14','2026-09-21',
        '2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23'
    ];
    
    function formatDate(date) {
        var y = date.getFullYear();
        var m = ('0' + (date.getMonth() + 1)).slice(-2);
        var d = ('0' + date.getDate()).slice(-2);
        return y + '-' + m + '-' + d;
    }
   
    function isHoliday(date) {
        var dayOfWeek = date.getDay();
        var formattedDate = formatDate(date);
        if (dayOfWeek === 0) return { isClosed: true, dayName: '日' };
        if (dayOfWeek === 6) return { isClosed: true, dayName: '土' };
        if (HOLIDAYS.indexOf(formattedDate) !== -1) {
            var dayNames = ['日','月','火','水','木','金','土'];
            return { isClosed: true, dayName: dayNames[dayOfWeek] };
        }
        var dayNames = ['日','月','火','水','木','金','土'];
        return { isClosed: false, dayName: dayNames[dayOfWeek] };
    }
   
    function renderCalendar() {
        var viewport = document.getElementById('calendar-viewport');
        var buttons = document.querySelectorAll('#prev-day-btn-cal, #next-day-btn-cal');
       
        var buttonTotalWidth = 0;
        buttons.forEach(btn => {
            buttonTotalWidth += (btn.offsetWidth || 44) + 12;
        });
       
        var viewportWidth = viewport.clientWidth;
        var availableWidth = viewportWidth - buttonTotalWidth - 16;
       
        var idealSlotWidth = Math.floor(availableWidth / DAYS_TO_SHOW);
        var slotWidth = Math.max(42, Math.min(78, idealSlotWidth));
        var slotGap = slotWidth <= 50 ? 3 : 4;
       
        var headerFont = Math.max(10, Math.floor(slotWidth * 0.24));
        var dateFont = Math.max(20, Math.floor(slotWidth * 0.55));
       
        document.documentElement.style.setProperty('--slot-width', slotWidth + 'px');
        document.documentElement.style.setProperty('--slot-gap', slotGap + 'px');
        document.documentElement.style.setProperty('--header-font', headerFont + 'px');
        document.documentElement.style.setProperty('--date-font', dateFont + 'px');
       
        calView.innerHTML = '';
        var today = new Date();
       
        for (var i = 0; i < DAYS_TO_SHOW; i++) {
            var date = new Date(currentDate);
            date.setDate(currentDate.getDate() + i);
            var dayStatus = isHoliday(date);
            var isToday = date.toDateString() === today.toDateString();
           
            var dayClasses = 'date-slot';
            if (dayStatus.isClosed) dayClasses += ' holiday-slot';
            else dayClasses += ' weekday-slot';
            if (isToday) dayClasses += ' is-today-cal';
           
            var monthDisplay = date.getMonth() + 1;
            var dateDisplay = date.getDate();
            var dayName = dayStatus.dayName;
           
            var html = `
                <div class="${dayClasses}">
                    <div class="header-row-cal">
                        <span class="month-day-cal">${monthDisplay}/</span>
                        <span class="day-of-week-cal">${dayName}</span>
                    </div>
                    <div class="date-row-cal">
                        <span>${dateDisplay}</span>
                    </div>
                    ${isToday ? '<div class="today-indicator-cal"></div>' : ''}
                </div>
            `;
            calView.insertAdjacentHTML('beforeend', html);
        }
       
        var totalWidth = DAYS_TO_SHOW * slotWidth + (DAYS_TO_SHOW - 1) * slotGap;
        calView.style.width = totalWidth + 'px';
    }
   
    function scrollCalendar(direction) {
        calView.style.transition = 'none';
        calViewport.style.transform = 'translateX(0)';
       
        calView.offsetHeight;
       
        if (direction === 'prev') {
            currentDate.setDate(currentDate.getDate() - DAYS_TO_SHOW);
            calView.style.transform = 'translateX(-100%)';
        } else {
            currentDate.setDate(currentDate.getDate() + DAYS_TO_SHOW);
            calView.style.transform = 'translateX(100%)';
        }
       
        renderCalendar();
       
        setTimeout(function() {
            calView.style.transition = 'transform ' + (CALENDAR_TRANSITION / 1000) + 's cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            calView.style.transform = 'translateX(0)';
        }, 50);
    }
   
    prevDayBtnCal.addEventListener('click', function() { scrollCalendar('prev'); });
    nextDayBtnCal.addEventListener('click', function() { scrollCalendar('next'); });
   
    window.addEventListener('resize', function() {
        renderCalendar();
    });
   
    setTimeout(renderCalendar, 50);
    setTimeout(renderCalendar, 200);
    setTimeout(renderCalendar, 500);
    
    // メインイメージスライド
    var mainSlides = document.querySelectorAll('#main-slider .fade-image');
    var currentMainIndex = 0;
    var mainSlideInterval = 4500;
    if (mainSlides.length > 1) {
        mainSlides.forEach(function(slide, i) { slide.classList.toggle('active', i === 0); });
        function nextMainSlide() {
            mainSlides[currentMainIndex].classList.remove('active');
            currentMainIndex = (currentMainIndex + 1) % mainSlides.length;
            mainSlides[currentMainIndex].classList.add('active');
        }
        setInterval(nextMainSlide, mainSlideInterval);
    }
    
    // 商品スライダー
    var wrapper = document.getElementById('product-slider-wrapper');
    var originalItems = Array.from(document.querySelectorAll('#product-slider-wrapper > .product-slide-item'));
    var viewport = document.getElementById('product-slider-viewport');
    var prevBtn = document.getElementById('prev-btn');
    var nextBtn = document.getElementById('next-btn');
    
    if (originalItems.length > 0) {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
        var itemsPerView = 3;
        var GAP_PX = 16;
        var originalTotalItems = originalItems.length;
        var CLONE_COUNT = itemsPerView + 2;
        var currentSlideIndex = CLONE_COUNT;
        var itemWidthWithGap = 0;
        var AUTO_SLIDE_DURATION = 3500;
        var autoSlideTimer = null;
        
        function setupClones() {
            var existingClones = wrapper.querySelectorAll('.clone');
            existingClones.forEach(function(clone) { clone.remove(); });
           
            for (var i = 0; i < CLONE_COUNT; i++) {
                var originalIndex = (originalTotalItems - CLONE_COUNT + i + originalTotalItems) % originalTotalItems;
                var clone = originalItems[originalIndex].cloneNode(true);
                clone.classList.add('clone', 'prepend-clone');
                wrapper.insertBefore(clone, originalItems[0]);
            }
            for (var i = 0; i < CLONE_COUNT; i++) {
                var clone = originalItems[i].cloneNode(true);
                clone.classList.add('clone', 'append-clone');
                wrapper.appendChild(clone);
            }
        }
       
        function updateSliderDimensions() {
            var allItems = Array.from(wrapper.children);
            var viewportWidth = viewport.clientWidth;
            var totalGaps = (itemsPerView - 1) * GAP_PX;
           
            var itemWidth = (viewportWidth - totalGaps) / itemsPerView;
            itemWidthWithGap = itemWidth + GAP_PX;
           
            allItems.forEach(function(item) {
                item.style.width = itemWidth + 'px';
            });
            var totalWrapperWidth = allItems.length * itemWidthWithGap;
            wrapper.style.width = totalWrapperWidth + 'px';
            updateSlidePosition(false);
        }
        
        function updateSlidePosition(animate) {
            if (animate === undefined) animate = true;
            var offset = -currentSlideIndex * itemWidthWithGap;
           
            wrapper.style.transition = animate
                ? 'transform ' + TRANSITION_DURATION + 'ms ease-in-out'
                : 'none';
           
            wrapper.style.transform = 'translateX(' + offset + 'px)';
           
            if (animate) {
                if (currentSlideIndex >= originalTotalItems + CLONE_COUNT) {
                    setTimeout(function() {
                        currentSlideIndex = CLONE_COUNT;
                        wrapper.style.transition = 'none';
                        wrapper.style.transform = 'translateX(' + (-currentSlideIndex * itemWidthWithGap) + 'px)';
                    }, TRANSITION_DURATION);
                } else if (currentSlideIndex < CLONE_COUNT) {
                    setTimeout(function() {
                        currentSlideIndex = originalTotalItems + CLONE_COUNT - 1;
                        wrapper.style.transition = 'none';
                        wrapper.style.transform = 'translateX(' + (-currentSlideIndex * itemWidthWithGap) + 'px)';
                    }, TRANSITION_DURATION);
                }
            }
        }
        
        function nextAutoSlide() {
            currentSlideIndex++;
            updateSlidePosition(true);
        }
        
        function startAutoSlide() {
            if (autoSlideTimer === null) {
                autoSlideTimer = setInterval(nextAutoSlide, AUTO_SLIDE_DURATION);
            }
        }
        
        function stopAutoSlide() {
            if (autoSlideTimer !== null) {
                clearInterval(autoSlideTimer);
                autoSlideTimer = null;
            }
        }
        
        prevBtn.addEventListener('click', function() {
            stopAutoSlide();
            currentSlideIndex--;
            updateSlidePosition(true);
            startAutoSlide();
        });
        
        nextBtn.addEventListener('click', function() {
            stopAutoSlide();
            currentSlideIndex++;
            updateSlidePosition(true);
            startAutoSlide();
        });
       
        viewport.addEventListener('mouseover', stopAutoSlide);
        viewport.addEventListener('mouseout', startAutoSlide);
       
        function initStandardCarousel() {
            setupClones();
            updateSliderDimensions();
            startAutoSlide();
        }
        
        window.addEventListener('resize', function() {
            setupClones();
            updateSliderDimensions();
        });
       
        initStandardCarousel();
    } else {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
    }
});
</script>
</body>
