<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="EUC-JP">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆめはん フッター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{margin:0;padding:0;background:#fff;font-family:system-ui,-apple-system,sans-serif;}
        a{text-decoration:none;}
        
        /* タイトル上下にライン */
        #calendar-title{
            background:white;
            padding:14px 16px;
            border-top:1px solid #e5e7eb;
            border-bottom:1px solid #e5e7eb;
            text-align:center;
            font-weight:600;
            color:#334155;
            line-height:1.5;
        }
        #calendar-title .main{font-size:16px;}
        #calendar-title .note{font-size:13.5px;color:#dc2626;margin-top:6px;}

        #calendar-bar{width:100%;background:white;border-bottom:1px solid rgba(209, 209, 209, 0.733);padding:8px 0;height:72px;display:flex;align-items:center;}
        #calendar-inner{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;align-items:center;justify-content:center;height:100%;}
        #calendar-viewport{display:flex;align-items:center;width:100%;overflow:hidden;position:relative;height:56px;padding:0 4px;}
        #calendar-view{display:flex;align-items:center;width:max-content;transition:transform .6s cubic-bezier(.25,.46,.45,.94);}

        #prev-day-btn-cal,#next-day-btn-cal{flex-shrink:0;margin:0 6px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);border:2px solid #e2e8f0;border-radius:9999px;transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#64748b;z-index:10;}
        @media(max-width:480px){#prev-day-btn-cal,#next-day-btn-cal{width:36px;height:36px;}}
        @media(min-width:481px)and(max-width:768px){#prev-day-btn-cal,#next-day-btn-cal{width:40px;height:40px;}}
        @media(min-width:769px){#prev-day-btn-cal,#next-day-btn-cal{width:44px;height:44px;}}
        #prev-day-btn-cal:hover,#next-day-btn-cal:hover{background:linear-gradient(135deg,#e2e8f0 0%,#cbd5e1 100%);border-color:#cbd5e1;transform:scale(1.05);box-shadow:0 4px 12px rgba(0,0,0,.15);}

        .date-slot{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:var(--slot-width,42px);height:var(--slot-width,42px);padding:2px 2px 0 2px;border:1px solid #e5e7eb;border-radius:8px;background:#f1f5f9;font-weight:600;transition:all .2s;position:relative;box-sizing:border-box;margin-right:var(--slot-gap,3px);}
        .holiday-slot{background:linear-gradient(135deg,#fee2e2 0%,#fecaca 100%);color:#dc2626;border-color:#fca5a5;font-weight:700;}
        .weekday-slot{background:#f1f5f9;color:#1f2937;border-color:#d1d5db;}
        .is-today-cal{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2);background:linear-gradient(135deg,#eff6ff 0%,#dbeafe 100%);}
        .header-row-cal{display:flex;justify-content:space-between;width:100%;font-size:var(--header-font,10px);line-height:1;margin-bottom:-1px;font-weight:500;}
        .date-row-cal{display:flex;justify-content:center;align-items:center;width:100%;flex:1;font-size:var(--date-font,20px);font-weight:700;line-height:1;}
        .today-indicator-cal{position:absolute;bottom:1px;right:1px;width:6px;height:6px;background:#3b82f6;border-radius:50%;box-shadow:0 0 0 1px white;}

        #footer-links{background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);padding:44px 16px 52px;}
        .link-group{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 38px;max-width:1280px;margin:0 auto;}
        @media(max-width:560px){.link-group{gap:16px 26px;}}
        .link-item{display:flex;flex-direction:column;align-items:center;color:#475569;transition:all .35s;width:94px;text-align:center;}
        .link-item:hover{transform:translateY(-12px);}
        .link-item span{font-size:14px;margin-top:14px;transition:all .35s;font-weight:600;}
        .link-item:hover span{font-weight:800;color:#1e293b;}

        /* サークル60px、影を控えめに */
        .icon-circle{
            width:60px;
            height:60px;
            border-radius:50%;
            background:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            box-shadow:0 6px 20px rgba(0,0,0,0.1);   /* ← 軽やかに変更 */
            transition:all .4s;
        }
        .link-item:hover .icon-circle{
            transform:scale(1.25);
            box-shadow:0 16px 40px rgba(0,0,0,0.22);
        }

        #copyright{background:#1e293b;color:#cbd5e1;text-align:center;padding:28px;font-size:14.8px;letter-spacing:1.3px;}
    </style>
</head>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const view = document.getElementById('calendar-view');
    const viewport = document.getElementById('calendar-viewport');
    const prevBtn = document.getElementById('prev-day-btn-cal');
    const nextBtn = document.getElementById('next-day-btn-cal');
    
    let currentDate = new Date();
    const DAYS_TO_SHOW = 14;

    const HOLIDAYS = ['2025-11-03','2025-11-23','2025-11-24','2025-12-29','2025-12-30','2025-12-31','2026-01-01','2026-01-02','2026-01-12','2026-02-11','2026-02-23','2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06','2026-07-20','2026-08-10','2026-08-11','2026-08-12','2026-08-13','2026-08-14','2026-09-21','2026-09-22','2026-09-23','2026-10-12','2026-11-03','2026-11-23'];

    function formatDate(d) {
        const y = d.getFullYear();
        const m = ('0' + (d.getMonth() + 1)).slice(-2);
        const date = ('0' + d.getDate()).slice(-2);
        return `${y}-${m}-${date}`;
    }

    function isHoliday(d) {
        const wd = d.getDay();
        const f = formatDate(d);
        const isClosed = wd === 0 || wd === 6 || HOLIDAYS.includes(f);
        return { isClosed, dayName: '日月火水木金土'[wd] };
    }

    function renderCalendar() {
        const btnW = prevBtn.offsetWidth + nextBtn.offsetWidth + 48;
        const avail = viewport.clientWidth - btnW;
        const slotW = Math.max(42, Math.min(78, Math.floor(avail / DAYS_TO_SHOW)));
        const gap = slotW <= 50 ? 3 : 4;

        document.documentElement.style.setProperty('--slot-width', slotW + 'px');
        document.documentElement.style.setProperty('--slot-gap', gap + 'px');
        document.documentElement.style.setProperty('--header-font', Math.max(10, Math.floor(slotW * 0.24)) + 'px');
        document.documentElement.style.setProperty('--date-font', Math.max(20, Math.floor(slotW * 0.55)) + 'px');

        view.innerHTML = '';
        const today = new Date();

        for (let i = 0; i < DAYS_TO_SHOW; i++) {
            const d = new Date(currentDate);
            d.setDate(currentDate.getDate() + i);
            const { isClosed, dayName } = isHoliday(d);
            const isToday = d.toDateString() === today.toDateString();

            const slot = document.createElement('div');
            slot.className = `date-slot ${isClosed ? 'holiday-slot' : 'weekday-slot'} ${isToday ? 'is-today-cal' : ''}`;
            slot.innerHTML = `
                <div class="header-row-cal"><span class="month-day-cal">${d.getMonth()+1}/</span><span class="day-of-week-cal">${dayName}</span></div>
                <div class="date-row-cal"><span>${d.getDate()}</span></div>
                ${isToday ? '<div class="today-indicator-cal"></div>' : ''}
            `;
            view.appendChild(slot);
        }
    }

    function slideTo(direction) {
        const slotWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slot-width'));
        const gap = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slot-gap'));
        const distance = (slotWidth + gap) * DAYS_TO_SHOW;

        if (direction === 'next') {
            view.style.transform = `translateX(-${distance}px)`;
            currentDate.setDate(currentDate.getDate() + DAYS_TO_SHOW);
        } else {
            view.style.transform = `translateX(${distance}px)`;
            currentDate.setDate(currentDate.getDate() - DAYS_TO_SHOW);
        }

        setTimeout(() => {
            renderCalendar();
            view.style.transition = 'none';
            view.style.transform = 'translateX(0)';
            setTimeout(() => { view.style.transition = ''; }, 50);
        }, 600);
    }

    prevBtn.onclick = () => slideTo('prev');
    nextBtn.onclick = () => slideTo('next');

    window.addEventListener('resize', renderCalendar);
    renderCalendar();

    // ホバー色変更
    document.querySelectorAll('.link-item').forEach(item => {
        const svg = item.querySelector('.icon-svg');
        const defaultColor = '#475569';
        const hoverColor = svg.dataset.color;
        item.addEventListener('mouseenter', () => svg.style.fill = hoverColor);
        item.addEventListener('mouseleave', () => svg.style.fill = defaultColor);
    });
});
</script>
