				return value.split(/[\n,]/).map(function (part) {
					return (part || '').trim()
				}).filter(function (part) {
					return part.length > 0
				})
			}

			function getRegistryTheme(registry, styleId) {
				var fallback = HISTORY_FOOTER_FALLBACK.styles['101']
				if (!registry || !registry.styles || typeof registry.styles !== 'object') return fallback

				var defaultStyle = String(registry.defaultStyle || '101')
				var theme = registry.styles[String(styleId)] || registry.styles[defaultStyle] || fallback

			function resolveFooterTheme(registry) {
				var colorParts = splitColorSpec(historySetup['iframe_100_bg_color'])
				var firstValue = colorParts[0] || ''
				var legacyTextColor = colorParts[1] || ''
				var defaultStyle = registry && registry.defaultStyle ? String(registry.defaultStyle) : '101'
				var selectedTheme = getRegistryTheme(registry, defaultStyle)
				var backgroundColor = selectedTheme.background

					textColor = selectedTheme.text
				} else if (firstValue && isValidColor(firstValue)) {

				}

				return {background: backgroundColor, text: textColor}
			}

			function applyFooterTheme(theme) {
				document.body.style.backgroundColor = theme.background

				var h1 = document.querySelector('h1')
				if (h1) h1.style.color = theme.text

				var rows = document.querySelectorAll('ul li')
				for (var i = 0; i < rows.length; i++) {
					rows[i].style.color = theme.text
				}
			}

			function loadFooterThemes() {
				if (typeof fetch !== 'function') {
					return Promise.resolve(HISTORY_FOOTER_FALLBACK)
				}

				var request = fetch(HISTORY_FOOTER_THEMES_URL, {credentials: 'omit'}).then(function (response) {
					if (!response.ok) throw new Error('history footer themes request failed')
					return response.json()
				})

				var timeout = new Promise(function (_, reject) {
					setTimeout(function () {
						reject(new Error('history footer themes request timed out'))
					}, HISTORY_FOOTER_THEMES_TIMEOUT)
				})

				return Promise.race([request, timeout]).catch(function () {
					return HISTORY_FOOTER_FALLBACK
				})
			}
