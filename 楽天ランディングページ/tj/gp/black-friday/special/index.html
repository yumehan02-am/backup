							if(shops[i].items[n].discounted){
								if(shops[i].items[n].price >= (shops[i].items[n].discounted*2)){
									item50.push(shops[i].items[n])
								}
							}
						}
					}

					// get coupons

					if(shops[i].coupons.length > 0){
						if(shops[i].weight>0){
							for(let z in shops[i].coupons){
								shops[i].coupons[z].itemimages = []
								for (let m in shops[i].items){
									shops[i].coupons[z].itemimages.push(shops[i].items[m].images[0])
								}
								shops[i].coupons[z].itemimages = shops[i].coupons[z].itemimages.slice(0,4)
								shops[i].coupons[z].shoptitle = shops[i].title
								shops[i].coupons[z].shoptag = shops[i].tagline
								shops[i].coupons[z].shopid = shops[i].shop_id
								shops[i].coupons[z].weight = shops[i].weight
								shops[i].coupons[z].depa = shops[i].depa
								shops[i].coupons[z].usabletime = Date.parse(shops[i].coupons[z].end) - Date.parse(shops[i].coupons[z].start);

								coupons_taken1.push(shops[i].coupons[z])
								couponsa.push(shops[i].coupons[z])
							}
						}else{
							shops[i].coupons[0].itemimages = []
							for (let m in shops[i].items){
								shops[i].coupons[0].itemimages.push(shops[i].items[m].images[0])
							}
							shops[i].coupons[0].itemimages = shops[i].coupons[0].itemimages.slice(0,4)
							shops[i].coupons[0].shoptitle = shops[i].title
							shops[i].coupons[0].shoptag = shops[i].tagline
							shops[i].coupons[0].shopid = shops[i].shop_id
							shops[i].coupons[0].weight = shops[i].weight
							shops[i].coupons[0].depa = shops[i].depa
							shops[i].coupons[0].usabletime = Date.parse(shops[i].coupons[0].end) - Date.parse(shops[i].coupons[0].start);

							coupons_taken2.push(shops[i].coupons[0])
							couponsa.push(shops[i].coupons[0])
						}

					}
				}


				function sortByProperty(array, property, order) {
					array.sort(function(a, b) {
							if (order === 'asc') {
									return a[property] < b[property] ? -1 : a[property] > b[property] ? 1 : 0;
							} else if (order === 'desc') {
									return a[property] > b[property] ? -1 : a[property] < b[property] ? 1 : 0;
							}
							return 0;
					});
				}

				function getCouponByType(array, type){
					let rows = []
					for (let i in array){
						if(array[i].type == type) rows.push(array[i])
					}
					return rows
				}


				// coupons

				// highest taken and amount

				function processCoupons(coupons) {
					const groupedCoupons = {};
					coupons.forEach(coupon => {
						const key = `${coupon.shopid}_${coupon.type}_${coupon.start}_${coupon.end}`;
						if (!groupedCoupons[key]) {
							groupedCoupons[key] = [];
						}
						groupedCoupons[key].push(coupon);
					});
					const resultCoupons = [];
					for (const key in groupedCoupons) {
						const group = groupedCoupons[key];
						if (group.length > 2) {
							const maxTakenCoupon = group.reduce((maxTaken, coupon) => {
								return coupon.taken > maxTaken.taken ? coupon : maxTaken;
							}, { taken: -Infinity });
							const maxAmountCoupon = group.reduce((maxAmount, coupon) => {
								return coupon.amount > maxAmount.amount ? coupon : maxAmount;
							}, { amount: -Infinity });
							resultCoupons.push(maxTakenCoupon, maxAmountCoupon);
						} else {
							resultCoupons.push(...group);
						}
					}
					return resultCoupons;
				}

				coupons_taken1 = processCoupons(coupons_taken1);

				// remove taken 0 if more than 1

				let shopidMap = {};
				coupons_taken1.forEach(item => {
					if (!shopidMap[item.shopid]) {
						shopidMap[item.shopid] = [];
					}
					shopidMap[item.shopid].push(item);
				});
				Object.keys(shopidMap).forEach(shopid => {
					let shopidArray = shopidMap[shopid];
					let takenGreaterThanZeroCount = shopidArray.filter(item => item.taken > 0).length;

					if (takenGreaterThanZeroCount > 1) {
						shopidMap[shopid] = shopidArray.filter(item => item.taken > 0);
					}
				});
				coupons_taken1 = [].concat(...Object.values(shopidMap));


				// remove the same only keep one

				coupons_taken1 = Array.from(new Set(coupons_taken1.map(JSON.stringify)), JSON.parse);

				// keep 5 with same shopid

				let shopidCount = {};
				coupons_taken1 = coupons_taken1.filter((coupon) => {
					const shopid = coupon.shopid;
					if (!shopidCount[shopid]) {
						shopidCount[shopid] = 1;
						return true;
					}
					if (shopidCount[shopid] < 5) {
						shopidCount[shopid]++;
						return true;
					}

					return false;
				});


				sortByProperty(couponsa, 'end', 'asc')

				function sortCoupons(type,cate) {

					let rows0 = []
					let rows = []
					let rows_more = []

					if(type == 'time'){
						rows0 = couponsa
					}
					else if(type == 'percent' || type == 'flat'){
						let coupons_onlyflat = getCouponByType(couponsa, 'flat')
						let coupons_onlypercent = getCouponByType(couponsa, 'percent')

						sortByProperty(coupons_onlypercent, 'amount', 'desc')
						sortByProperty(coupons_onlyflat, 'amount', 'desc')

						if(type == 'flat') rows0 = [...coupons_onlyflat, ...coupons_onlypercent]
						if(type == 'percent') rows0 = [...coupons_onlypercent, ...coupons_onlyflat]
					}
					else if(type == 'created'){
						rows0 = JSON.parse(JSON.stringify(couponsa))
						rows0.sort(function(a, b) {
							if (a.created === 0 && b.created !== 0) {
								return 1;
							} else if (a.created !== 0 && b.created === 0) {
								return -1;
							}
							return a.created - b.created;
						});
					}
					else if(type == 'taken'){
						sortByProperty(coupons_taken1, 'taken', 'desc')

						let coupons_taken1a = []
						let coupons_taken1b = []
						for (let i in coupons_taken1){
							if (new Date(coupons_taken1[i].start) >= new Date(event_start) && new Date(coupons_taken1[i].end) <= new Date(event_end)){
								coupons_taken1a.push(coupons_taken1[i])
							}else{
								coupons_taken1b.push(coupons_taken1[i])
							}
						}
						// delete conpon from coupons_taken1b if it already in coupons_taken1a
						let shopidsIn1a = coupons_taken1a.map(item => item.shopid);
						coupons_taken1b = coupons_taken1b.filter(item => !shopidsIn1a.includes(item.shopid));
						// keep one shopid
						coupons_taken1b = Array.from(new Set(coupons_taken1b.map(item => item.shopid)))
						.map(shopid => coupons_taken1b.find(item => item.shopid === shopid));


						coupons_taken1 = [...coupons_taken1a, ...coupons_taken1b]

						let coupons_taken2a = []
						let coupons_taken2b = []
						for (let i in coupons_taken2){
							if (new Date(coupons_taken2[i].start) >= new Date(event_start) && new Date(coupons_taken2[i].end) <= new Date(event_end)){
								coupons_taken2a.push(coupons_taken2[i])
							}else{
								coupons_taken2b.push(coupons_taken2[i])
							}
						}
						coupons_taken2 = [...coupons_taken2a, ...coupons_taken2b]
						rows0 = [...coupons_taken1, ...coupons_taken2]
					}
					else if(type = 'usabletime'){
						rows0 = JSON.parse(JSON.stringify(couponsa))
						sortByProperty(rows0, 'usabletime', 'asc')
					}

					if(cate != null && cate != 'カテゴリ'){
						for (let i in rows0){
							if(rows0[i].depa == cate) rows.push(rows0[i]);
						}
					}else{
						rows = rows0
					}

					rows_more = rows.slice(40)
					rows = rows.slice(0,40)

					return {rows, rows_more}
				}

				function get_coupon_html(couponsa) {
					let cou_html = ''
					for (let i in couponsa){
						cou_html += `<div class='con2' onclick="couponClick('${couponsa[i].shopid}')"><div class='con2_top'><div class='ct_shoptitle'><a href='${couponsa[i].url}' class='black' target='_blank' rel='nofollow sponsored noopener'>${couponsa[i].shoptitle}</a></div><div class='ct_shoptag'><a href='${couponsa[i].url}' class='black' target='_blank' rel='nofollow sponsored noopener'>${(couponsa[i].shoptag||'').replace(/<[^>]+>/g,"")}</a></div></div>`

							cou_html += `<div class='con_image'><a href='${couponsa[i].url}' class='black' target='_blank' rel='nofollow sponsored noopener'><img src="${couponsa[i].itemimages[n]}?fitin=120:120" loading="lazy"></a></div>`
						}

						cou_html += `<div class="con2_dis"><a href='${couponsa[i].url}' target='_blank' rel='nofollow sponsored noopener'>`
						if(couponsa[i].type == 'percent') cou_html += `${couponsa[i].amount}%`
						else cou_html += `${couponsa[i].amount}円`
						cou_html += ` OFF</a></div>`
						cou_html += `<div class='cp_title'><a href='${couponsa[i].url}' class='black' target='_blank' rel='nofollow sponsored noopener'>${couponsa[i].title}</a></div><div class='cp_end'><a href='${couponsa[i].url}' class='black' target='_blank' onclick="itemClick('${couponsa[i].shopid}')" rel='nofollow sponsored noopener'>開始日時：${couponsa[i].start}<br>有効期限：${couponsa[i].end}</a></div><div style="flex-basis:100%;border-top:dashed 1px #aaa;"></div>
									<div style="flex-basis:15%;background:#faef7f"><img src='coupon_icon.png' style="padding:0 5px;width:60%;" loading="lazy"></div>
									<div style="flex-basis:75%;background:#faef7f;position:relative;">
										<div style="position: absolute;top: 50%;transform: translate(0, -50%);"><a href='${couponsa[i].url}' class='black' target='_blank'	rel='nofollow sponsored noopener'>クーポンはこちら</a></div>
									</div>
									<div style="flex-basis:10%;background:#faef7f;position:relative;font-size:18px">
										<div style="position: absolute;top: 50%;transform: translate(0, -50%);">→</div>
									</div>
								<div style="clear:both"></div>
							</div>`
					}
					return cou_html
				}

				document.getElementById("coupon_list").innerHTML = get_coupon_html(sortCoupons('taken', null).rows)








				// top items

				item50.sort(() => Math.random() - 0.5)
				itemsa.sort(() => Math.random() - 0.5)
				itemsa_noshui.sort(() => Math.random() - 0.5)
				let item_num = 32

				for (let i in itemsa){
					for (let d in departments){
						if(departments[d].name == itemsa[i].depa) departments[d].data.push(itemsa[i])

				}

				function get_item_html(itemsa) {
						let htmls = ''
						htmls += `<div class="flex_item flex_item_num" onclick="itemClick('${itemsa.shop_id}')"><div class="flex_box"><div class="flex_box_image"><a href='${itemsa.url}' target='_blank'><img src="${itemsa.image}?fitin=240:240" rel='nofollow sponsored noopener' loading="lazy"></a></div><div class="flex_box_itemt1"><a href='${itemsa.url}' class='black' target='_blank' rel='nofollow sponsored noopener'>${itemsa.title}</a></div>`

						htmls += `<div class="flex_box_price"><a href='${itemsa.url}' class='pricered' target='_blank' rel='nofollow sponsored noopener'>`
						if(itemsa.discounted) htmls += `${itemsa.discounted.toLocaleString('en-US')}<small>円</small>`
						else htmls += `${itemsa.price.toLocaleString('en-US')}<small>円</small>`

						return htmls;
				}

				let items_html = []
				items_html[0] = []

				for (let n=0; n<=(item_page-1); n++){
					let htmls = ''
					for (let i in itemsa_noshui){

							htmls += get_item_html(itemsa_noshui[i])
						}

					}
					items_html[0][n] = htmls

				for (let d in departments){
