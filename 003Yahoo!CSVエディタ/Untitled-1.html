<!--
yahoo_triple_slide_banner.html
- Yahoo!ショッピング（トリプル枠）向けのシンプルなスライドバナー（単一ファイル）
使い方：画像を .slide 要素の data-img 属性か <img> に差し替え、リンクを <a class="slide-link"> に入れてください。
注意：Yahoo!側の外部スクリプトやスタイル制限がある場合は、インライン化や許容ルールに合わせてください。
-->


<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yahoo!ショッピング用 スライドバナー（トリプル）</title>


<style>
:root{
--banner-width: 100%; /* 横幅はコンテナに合わせる */
--banner-height: 220px; /* PC 表示の高さ（必要に応じて調整） */
--dot-size: 10px;
--transition-time: 600ms;
--autoplay-interval: 4500; /* ミリ秒 */
}


/* バナー全体 */
.yjs-banner{
width: var(--banner-width);
max-width: 1200px;
margin: 0 auto;
position: relative;
overflow: hidden;
border-radius: 6px;
box-shadow: 0 6px 18px rgba(0,0,0,0.08);
background: #f5f5f5;
}


/* スライドを横並びにするラッパー */
.yjs-slides{
display: flex;
gap: 0;
transition: transform var(--transition-time) ease;
will-change: transform;
}


.yjs-slide{
min-width: 100%;
box-sizing: border-box;
position: relative;
user-select: none;
overflow: hidden;
height: var(--banner-height);
display: flex;
align-items: center;
justify-content: center;
background: #ddd;
}


.yjs-slide img{
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}


/* テキスト重ね用（任意） */
.yjs-caption{
position: absolute;
left: 18px;
bottom: 18px;
background: rgba(0,0,0,0.45);
color: #fff;
padding: 10px 14px;
border-radius: 6px;
font-size: 14px;
max-width: calc(100% - 36px);
box-sizing: border-box;
}


/* 左右ナビ */
</html>
