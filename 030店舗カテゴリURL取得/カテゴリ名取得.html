<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <title>楽天カテゴリ CSV 変換ツール</title><!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script><!-- Canva SDKs -->
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
  <script>
    // ====== 設定デフォルト ======
    const defaultConfig = {
      main_title: "楽天 店内カテゴリ → CSV 変換ツール",
      description_text: "楽天店舗ページ全体をコピー＆ペーストしてください。「店舗内カテゴリトップ」以降のすべてのカテゴリを自動抽出します。",
      generate_button_text: "CSVを生成",
      download_button_text: "CSVをダウンロード",
      background_color: "#0f172a",
      surface_color: "#1e293b",
      text_color: "#e5e7eb",
      primary_action_color: "#f97316",
      secondary_action_color: "#38bdf8",
      font_family: "system-ui",
      font_size: 15
    };

    let textareaInput, resultTextarea, statusText, downloadBtn, generateBtn, titleEl, descEl;
    let lastPastedHTML = "";
    let lastPastedText = "";

    // ====== onConfigChange: 見た目更新 ======
    async function onConfigChange(config) {
      const cfg = Object.assign({}, defaultConfig, config || {});
      const baseFont = cfg.font_family || defaultConfig.font_family;
      const baseSize = Number(cfg.font_size || defaultConfig.font_size) || 15;
      const fontStack = `${baseFont}, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;

      const root = document.documentElement;
      root.style.backgroundColor = cfg.background_color;
      document.body.style.backgroundColor = cfg.background_color;
      document.body.style.color = cfg.text_color;
      document.body.style.fontFamily = fontStack;
      document.body.style.fontSize = baseSize + "px";

      if (titleEl) {
        titleEl.textContent = cfg.main_title || defaultConfig.main_title;
        titleEl.style.color = cfg.text_color;
        titleEl.style.fontFamily = fontStack;
        titleEl.style.fontSize = (baseSize * 1.7) + "px";
      }
      if (descEl) {
        descEl.textContent = cfg.description_text || defaultConfig.description_text;
        descEl.style.color = cfg.text_color;
        descEl.style.fontFamily = fontStack;
        descEl.style.fontSize = (baseSize * 0.95) + "px";
      }
      if (generateBtn) {
        generateBtn.textContent = cfg.generate_button_text || defaultConfig.generate_button_text;
        generateBtn.style.backgroundColor = cfg.primary_action_color;
        generateBtn.style.color = "#000000";
        generateBtn.style.fontFamily = fontStack;
        generateBtn.style.fontSize = (baseSize * 0.95) + "px";
      }
      if (downloadBtn) {
        downloadBtn.textContent = cfg.download_button_text || defaultConfig.download_button_text;
        downloadBtn.style.backgroundColor = cfg.secondary_action_color;
        downloadBtn.style.color = "#0f172a";
        downloadBtn.style.fontFamily = fontStack;
        downloadBtn.style.fontSize = (baseSize * 0.95) + "px";
      }

      const card = document.getElementById("main-card");
      if (card) {
        card.style.backgroundColor = cfg.surface_color;
        card.style.color = cfg.text_color;
        card.style.fontFamily = fontStack;
      }

      const labels = document.querySelectorAll(".cc-label");
      labels.forEach(l => {
        l.style.color = cfg.text_color;
        l.style.fontFamily = fontStack;
        l.style.fontSize = (baseSize * 0.9) + "px";
      });

      if (textareaInput) {
        textareaInput.style.fontFamily = fontStack;
        textareaInput.style.fontSize = baseSize + "px";
      }
      if (resultTextarea) {
        resultTextarea.style.fontFamily = fontStack;
        resultTextarea.style.fontSize = (baseSize * 0.9) + "px";
      }
      if (statusText) {
        statusText.style.fontFamily = fontStack;
        statusText.style.fontSize = (baseSize * 0.8) + "px";
        statusText.style.color = cfg.secondary_action_color;
      }
    }

    // ====== Capabilities ======
    function mapToCapabilities(config) {
      const cfg = Object.assign({}, defaultConfig, config || {});
      return {
        recolorables: [
          {
            get: () => cfg.background_color,
            set: (value) => {
              cfg.background_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => cfg.surface_color,
            set: (value) => {
              cfg.surface_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ surface_color: value });
            }
          },
          {
            get: () => cfg.text_color,
            set: (value) => {
              cfg.text_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => cfg.primary_action_color,
            set: (value) => {
              cfg.primary_action_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ primary_action_color: value });
            }
          },
          {
            get: () => cfg.secondary_action_color,
            set: (value) => {
              cfg.secondary_action_color = value;
              if (window.elementSdk) window.elementSdk.setConfig({ secondary_action_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => cfg.font_family,
          set: (value) => {
            cfg.font_family = value;
            if (window.elementSdk) window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => Number(cfg.font_size) || defaultConfig.font_size,
          set: (value) => {
            cfg.font_size = value;
            if (window.elementSdk) window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      const cfg = Object.assign({}, defaultConfig, config || {});
      return new Map([
        ["main_title", cfg.main_title],
        ["description_text", cfg.description_text],
        ["generate_button_text", cfg.generate_button_text],
        ["download_button_text", cfg.download_button_text]
      ]);
    }

    // ====== フェーズ1: テキストとHTMLからカテゴリ名とURLを抽出 ======
    function extractLinksFromHTML(html, plainText) {
      // テキストから「店舗内カテゴリトップ」と「その他のカテゴリ」の範囲を検出
      const lines = plainText.split(/\r?\n/);
      let startLineIndex = -1;
      let endLineIndex = lines.length;
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line === "店舗内カテゴリトップ") {
          startLineIndex = i;
          console.log(`[テキスト範囲検出] 開始行: ${i}行目 (店舗内カテゴリトップ)`);
          break; // 開始位置が見つかったら終了
        }
      }
      
      if (startLineIndex === -1) {
        console.log("[範囲検出] 「店舗内カテゴリトップ」が見つかりません。");
        return [];
      }
      
      // 範囲内のテキスト行からカテゴリ名を抽出（「その他のカテゴリ」は含める）
      const categoryNamesInRange = new Set();
      for (let i = startLineIndex + 1; i < lines.length; i++) {
        const line = lines[i].trim();
        
        // 空行はスキップ
        if (!line) continue;
        
        // 階層記号を除去してカテゴリ名を抽出
        const cleanName = line.replace(/^[■│├└▼\s\t]+/, '').trim();
        if (cleanName && cleanName.length > 0) {
          categoryNamesInRange.add(cleanName);
        }
      }
      
      console.log(`[範囲内���テゴリ名] ${categoryNamesInRange.size}件検出`);
      console.log("カテゴリ名サンプル:", Array.from(categoryNamesInRange).slice(0, 10));
      
      // HTMLからリンクを抽出
      const div = document.createElement("div");
      div.innerHTML = html;
      const anchors = Array.from(div.querySelectorAll("a"));
      
      // リンクとカテゴリ名を照合
      const results = [];
      anchors.forEach(a => {
        const linkText = (a.textContent || "").trim();
        const href = a.getAttribute("href") || "";
        
        if (!linkText || linkText === "店舗内カテゴリトップ" || linkText === "その他のカテゴリ") {
          return;
        }
        
        // 範囲内のカテゴリ名に含まれている場合のみ追加
        if (categoryNamesInRange.has(linkText)) {
          results.push({ 
            name: linkText,
            url: href
          });
          categoryNamesInRange.delete(linkText); // 重複を避け��ため削除
        }
      });

      console.log(`=== フェーズ1: 抽出されたカテゴリとURL（${results.length}件、最初の10件）===`);
      console.log(results.slice(0, 10));
      return results;
    }

    // ====== フェーズ2: テキストから各カテゴリ名の階層情報を取得 ======
    function detectHierarchyFromText(plainText, categories) {
      const lines = plainText.split(/\r?\n/);
      
      console.log("=== フェーズ2: テキスト行の解析（最初の30行）===");
      console.log(lines.slice(0, 30));

      const results = [];

      categories.forEach(cat => {
        // このカテゴリ名を含む行を探す
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          if (line.includes(cat.name)) {
            // 行の先頭から階層記号をカウント
            const level = detectLevelFromLine(line, cat.name);
            results.push({
              name: cat.name,
              url: cat.url,
              level: level,
              rawLine: line
            });
            break;
          }
        }
      });

      console.log("=== フェーズ2完了: 階層付きカテゴリ（最初の10件）===");
      console.log(results.slice(0, 10));
      return results;
    }

    // ====== 行から階層レベルを判定 ======
    function detectLevelFromLine(line, categoryName) {
      // カテゴリ名より前の部分を取得
      const beforeCategory = line.substring(0, line.indexOf(categoryName));
      
      // 階層記号をカウント（■、│、├、└、▼など）
      const blackSquares = (beforeCategory.match(/■/g) || []).length;
      const verticalLines = (beforeCategory.match(/│/g) || []).length;
      const branches = (beforeCategory.match(/[├└]/g) || []).length;
      const triangles = (beforeCategory.match(/▼/g) || []).length;
      
      // タブとスペースもカウント
      const tabs = (beforeCategory.match(/\t/g) || []).length;
      const spaces = (beforeCategory.match(/ /g) || []).length;
      
      // レベル計算: ■の数を基準に、他の記号も考慮
      let level = blackSquares;
      
      // ■がない場合は他の記号でレベルを判定
      if (level === 0) {
        level = Math.max(verticalLines, branches, triangles, tabs, Math.floor(spaces / 2));
      }
      
      // 最��レベルは1
      if (level < 1) level = 1;
      
      console.log(`[階層判定] "${categoryName}" → レベル${level} (■:${blackSquares}, │:${verticalLines}, 分岐:${branches}, タブ:${tabs}, スペース:${spaces})`);
      
      return level;
    }

    // ====== ダウンロード処理 ======
    function downloadCSV(csvText) {
      // BOM付きでUTF-8エンコード
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, csvText], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      const now = new Date();
      const ts = now.toISOString().replace(/[:.]/g, "-").substring(0, 19);
      a.download = `rakuten_categories_${ts}.csv`;
      a.style.display = "none";
      document.body.appendChild(a);
      
      // クリックイベントを確実に発火
      setTimeout(() => {
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      }, 0);
    }

    // ====== ページ初期化 ======
    window.addEventListener("DOMContentLoaded", () => {
      textareaInput = document.getElementById("input-area");
      resultTextarea = document.getElementById("result-area");
      statusText = document.getElementById("status-text");
      downloadBtn = document.getElementById("download-btn");
      generateBtn = document.getElementById("generate-btn");
      titleEl = document.getElementById("main-title");
      descEl = document.getElementById("description");

      // ペーストイベント
      textareaInput.addEventListener("paste", (e) => {
        const clipboardData = e.clipboardData || window.clipboardData;
        if (clipboardData) {
          const htmlData = clipboardData.getData("text/html");
          const textData = clipboardData.getData("text/plain");
          
          lastPastedHTML = htmlData || "";
          lastPastedText = textData || "";
          
          let debugInfo = [];
          if (htmlData) {
            const linkCount = (htmlData.match(/<a\s+[^>]*href=/gi) || []).length;
            debugInfo.push(`HTML形式検出 (リンク${linkCount}個)`);
          }
          if (textData) {
            const lines = textData.split(/\r?\n/);
            debugInfo.push(`テキスト${lines.length}行`);
          }
          
          statusText.textContent = debugInfo.join(" / ") + " - 「CSVを生成」ボタンを押してください。";
        }
      });

      // 生成ボタン
      generateBtn.addEventListener("click", (e) => {
        e.preventDefault();
        
        const htmlData = lastPastedHTML || "";
        const textData = lastPastedText || textareaInput.value || "";
        
        console.log("=== 生成開始 ===");
        console.log("HTMLデータ長:", htmlData.length);
        console.log("テキストデータ長:", textData.length);
        
        let rows = [];
        
        // HTMLデータがある場合は2フェーズ処理
        if (htmlData && textData && /<a\s+[^>]*href=/i.test(htmlData)) {
          // フェーズ1: テキストとHTMLからカテゴリ名とURLを抽出
          const categories = extractLinksFromHTML(htmlData, textData);
          
          if (categories.length === 0) {
            statusText.textContent = "「店舗内カテゴリトップ」が見つかりませんでした。正しい範囲をコピーしてください。";
            resultTextarea.value = "";
            return;
          }
          
          // フェーズ2: テキストから階層情報を取得
          rows = detectHierarchyFromText(textData, categories);
        }
        
        // 親階層を追跡して parent_path を追加
        const parentStack = [];
        rows.forEach(row => {
          while (parentStack.length > 0 && parentStack[parentStack.length - 1].level >= row.level) {
            parentStack.pop();
          }
          if (parentStack.length > 0) {
            row.parent_path = parentStack.map(p => p.name).join("＞");
          } else {
            row.parent_path = "ルート";
          }
          parentStack.push({ level: row.level, name: row.name });
        });
        
        // CSV生成
        const header = ["level", "name", "parent_path", "url"];
        const csvLines = [header.join(",")];
        const escape = (val) => {
          const s = String(val ?? "");
          if (/[",\n]/.test(s)) {
            return '"' + s.replace(/"/g, '""') + '"';
          }
          return s;
        };
        rows.forEach(r => {
          csvLines.push([
            escape(r.level),
            escape(r.name),
            escape(r.parent_path),
            escape(r.url || "")
          ].join(","));
        });
        
        const csv = csvLines.join("\n");
        const count = rows.length;
        
        resultTextarea.value = csv;
        
        if (count > 0) {
          statusText.textContent = `${count}件のカテゴリを検出しました。CSVをコピーするか、ダウンロードボタンで保存できます。`;
        } else {
          statusText.textContent = `カテゴリが見つかりませんでした。コンソール（F12キー）で詳細を確認してください。`;
        }
        
        lastPastedHTML = "";
        lastPastedText = "";
      });

      // ダウンロードボタン
      downloadBtn.addEventListener("click", (e) => {
        e.preventDefault();
        const csvText = resultTextarea.value || "";
        if (!csvText.trim()) {
          statusText.textContent = "先にCSVを生成してください。";
          return;
        }
        downloadCSV(csvText);
        statusText.textContent = "CSVファイルをダウンロードしました。";
      });

      // Canva Element SDK 初期化
      if (window.elementSdk && typeof window.elementSdk.init === "function") {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange,
          mapToCapabilities,
          mapToEditPanelValues
        });
      } else {
        onConfigChange(defaultConfig);
      }
    });
  </script>
